# これを config.yml にコピーして値を埋める:  cp config.sample.yml config.yml
# config.yml は git にコミットしない（トークンを含むため）。配布は config.sample.yml のみ。

slack:
  # api.slack.com で取得（チャットに貼らない）
  bot_token: "xoxb-..."
  app_token: "xapp-..."

security:
  # 起動を許可する Slack ユーザーID（本人のみ推奨。空=全員許可で危険）
  # 取得: Slackで自分のプロフィール →「メンバーIDをコピー」（U から始まる）
  allowed_user_ids: ["U000000000"]
  # 反応を許可する DM/チャンネルID（空なら全許可）
  allowed_channel_ids: []
  # yolo(bypassPermissions) を /mode で選べるようにするか（既定 false 推奨）
  allow_bypass: false

paths:
  # 対象リポジトリ
  target_repo: "<プロジェクトのフルパス>"
  # タスク worktree を作る親（＝target_repo の1つ上。空でも同じ）
  worktree_parent: ""
  # 普通モードの作業ディレクトリ（＝target_repo の1つ上。空でも同じ）
  workspace_dir: ""

# タスクの実行方式。未指定なら solo。
#   solo = relay が claude を直接回す簡易実行。追加ツール不要でどこでも動く。
#          タスクごとに worktree を切って隔離するので複数タスクを安全に並行できる。
#   自作 = 自分のマルチエージェント/オーケストレーターを backends に差す。
#          ライフサイクル = start（起動）→ watch（進捗ファイルを AI が解釈して通知）。
# task:
#   # solo の調整（任意）
#   solo:
#     worktree: true        # タスクごとに worktree を切る（既定 true）
#     base: ""              # worktree のベース ref（空=現在ブランチ）
#
#   # 自作 backend を使う場合:
#   backend: my-agents
#   backends:
#     my-agents:
#       start:                          # タスク開始時に順に実行するフック
#         - kind: inject                #   inject = マネージャー(claude)にプロンプト注入
#           prompt: "新規タスク {id}: {task}"
#         # - kind: file                #   file = ファイルにタスクを書く
#         #   path: ".agents/todo.md"
#         #   template: "{task}\n"
#         # - kind: command             #   command = 任意のシェルコマンド
#         #   command: "my-agents add '{task}'"
#       watch: ".agents/progress.md"    # relay が監視し、AI が中身を解釈して完了/停滞/要判断を通知
#   # ※ 書式自由・相関タグ不要。AI が進捗ファイルを読んでタスクに紐付ける。
#   #   {task}=依頼内容, {id}=スレッド識別子

# behavior は任意（既定: task_keywords=作業/タスク/task, max_concurrent=2,
#   default_model=opus, default_permission_mode=acceptEdits, manager_permission_mode=acceptEdits）
behavior:
  # 自作 backend のマネージャーを無人で回すなら全許可。acceptEdits だと確認で止まる場合がある。
  manager_permission_mode: "acceptEdits"
  # task_keywords: ["作業", "タスク", "task"]
  # default_model: "opus"

# ユーザー定義コマンド（/<name>）。組み込みは /model /mode /commit /push のみ。
# プレースホルダ: {task}=スレッドのタスク参照, {version}=バージョン記法の解決結果, {arg}=生の引数
# version: true にすると引数を X.X.X+1 記法として解釈し {version} に入れる。
# 例（任意のデプロイコマンドを定義）:
# commands:
#   deploy:
#     version: true
#     confirm: "「{task}」を v{version} でデプロイします。"
#     prompt: "「{task}」を v{version} でデプロイして。"

bin:
  claude: "claude"
  cmux: "/Applications/cmux.app/Contents/Resources/bin/cmux"

# version:true のコマンド（/deploy 等）が使う「現在バージョン」の取得コマンド。
# 出力から最初の X.Y.Z を拾う。既定は git タグ。プロジェクトに合わせて変えてよい。
# version_source: "git describe --tags --abbrev=0"

# レジストリDBの保存先
registry_db: "./relay_registry.sqlite3"
