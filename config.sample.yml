# これを config.yml にコピーして値を埋める:  cp config.sample.yml config.yml
# config.yml は git にコミットしない（トークンを含むため）。配布は config.sample.yml のみ。
#
# DM のメッセージはそのまま作業指示（プレフィックス不要）。
# タスクは「1タスク=1 cmux セッション（タブ）」で実行する（cmux 必須）。
# 指示に該当する作業が既存セッションで動いていればそこへ連携、新規ならタブを増やして起動し、
# セッション画面の本文（増えた分）をそのままスレッドへ転送する。

slack:
  # api.slack.com で取得（チャットに貼らない）
  bot_token: "xoxb-..."
  app_token: "xapp-..."

security:
  # 起動を許可する Slack ユーザーID（本人のみ推奨。空=全員許可で危険）
  # 取得: Slackで自分のプロフィール →「メンバーIDをコピー」（U から始まる）
  allowed_user_ids: ["U000000000"]
  # 反応を許可する DM/チャンネルID（空なら全許可）
  allowed_channel_ids: []
  # /mode で yolo(bypassPermissions) を選べるようにするか（既定 false 推奨）
  allow_bypass: false

# 作業先リポジトリ（必須・名前付き。1つでも複数でもこの形式で書く）。
# 複数あるとき、新規タスクの作業先は
#   指示にリポジトリ名の明示（「docsの〜」等） > AI 判定（description が手掛かり） > default_repo
# の順で決まる。スレッドごとに作業先は記録され、タブ再作成時も引き継がれる。
repos:
  main:
    path: "<プロジェクトのフルパス>"
    description: "メインプロジェクトの開発"
# default_repo: "main"            # 省略時は repos の最初のエントリ

# モデル（すべて任意）
# models:
#   task: "fable"       # タスク実装（/model で変更可。fable/opus/sonnet/haiku）
#   match: "sonnet"     # セッション照合・リポジトリ振り分け（誤照合は注入事故になる）

# タスクセッション（cmux タブの claude）の権限の初期値（任意。既定 acceptEdits。/mode で変更可）。
# 無人運用では acceptEdits でも確認待ちで止まることがある。止めたくないなら
# "bypassPermissions"。その場合 allowed_user_ids を必ず自分だけに絞ること。
# permission_mode: "acceptEdits"

# セッションに注入するテンプレ（任意。{task}=依頼内容, {id}=スレッド識別子）
# prompt: "{task}"

# ユーザー定義コマンド（/<name>）。組み込みは /model /mode /commit /push のみ。
# プレースホルダ: {task}=スレッドのタスク参照, {version}=バージョン記法の解決結果, {arg}=生の引数
# version: true にすると引数を X.X.X+1 記法として解釈し {version} に入れる。
# commands:
#   deploy:
#     version: true
#     confirm: "「{task}」を v{version} でデプロイします。"
#     prompt: "「{task}」を v{version} でデプロイして。"

# version:true のコマンドが使う「現在バージョン」の取得コマンド（任意。既定は git タグ）
# version_source: "git describe --tags --abbrev=0"

# 実行バイナリ（任意）
# bin:
#   claude: "claude"
#   cmux: "/Applications/cmux.app/Contents/Resources/bin/cmux"

# レジストリDBの保存先（任意）
# registry_db: "./relay_registry.sqlite3"
